[package]
name = "ior-macos"
version = "1.2.9"
edition = "2021"
[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }
[dependencies]
tauri = { version = "=2.9.3", features = [] }
serde_json = "1"

# Keep runtime traits aligned with the pinned Tauri host.
tauri-runtime = "=2.9.2"
tauri-runtime-wry = "=2.9.3"
wry = { version = "=0.53.4", default-features = false }
tauri-macros = "=2.5.1"
tauri-codegen = "=2.5.2"
tauri-utils = "=2.8.1"
