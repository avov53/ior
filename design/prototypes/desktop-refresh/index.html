- Discovery catalog: https://www.shadcn.io/icons and https://www.shadcn.io/blocks
- Free component references: https://www.shadcn.io/ui/button , https://www.shadcn.io/ui/card , https://www.shadcn.io/ui/item
- Upstream source: https://github.com/shadcn-ui/ui/tree/main/apps/v4/registry/new-york-v4/ui
- Button, Card, Item and Badge are HTML adaptations for this standalone prototype. React renders reusable markup templates at build time. Tailwind utility rules are translated into local component CSS; existing delegated event handlers perform actions. This is not an installation of the paid shadcn.io Pro block catalog.
- Lucide icons are rendered from the already installed lucide-react package. Only selected SVG icons are embedded. The browser requires no CDN, React runtime or extra icon library.
- Old handmade SVG definitions and server-list renderer were replaced. Previous layouts remain in checkpoints for rollback; soft-surfaces.css is no longer loaded by the build.
- Production React frontend and WebView2 commands are not connected to this prototype.

    const item=dialog.item,kind=dialog.featureKind;if(['profile','route','subscription'].includes(kind)&&!item.name?.trim()){dialog.error='Введите название.';focusIntent='feature-name';render();return true;}
    if(kind==='profile'||kind==='route'){if(kind==='route'){item.routeOrder=[item.order0||item.routeOrder[0],item.order1||item.routeOrder[1],item.order2||item.routeOrder[2]];if(new Set(item.routeOrder).size!==3){dialog.error='Каждое действие в порядке обработки должно встречаться один раз.';render();return true;}}const items=kind==='profile'?state.profiles:state.routes;item.id ||= 'item-'+Date.now();item.name=item.name.trim();const index=items.findIndex(i=>i.id===item.id);if(index>=0)items[index]=structuredClone(item);else items.push(structuredClone(item));}
    if(kind==='subscription'){try{const url=new URL(item.url);if(!['http:','https:'].includes(url.protocol))throw Error()}catch{dialog.error='Нужен HTTP/HTTPS адрес подписки.';render();return true;}if(!Number.isFinite(Number(item.refreshIntervalHours))||Number(item.refreshIntervalHours)<1){dialog.error='Интервал должен быть не меньше одного часа.';render();return true;}item.autoRefreshEnabled=String(item.autoRefreshEnabled)!=='false';item.refreshIntervalHours=Number(item.refreshIntervalHours);const old=state.subscriptions.find(s=>s.id===item.id);const oldName=old?.name||item.id;if(old)Object.assign(old,item);else state.subscriptions.push({...item,id:item.id||'sub-'+Date.now()});for(const s of state.servers)if(s.source==='subscription'&&s.group===oldName)s.group=item.name;}
    if(kind==='hwid'){if(item.id==='global')state.prototypeHwid=structuredClone(item);else{const sub=state.subscriptions.find(s=>s.id===item.id);if(sub)Object.assign(sub,{hwidMode:item.hwidMode,hwidOverride:item.hwidOverride,hwidApprovedOrigins:item.hwidApprovedOrigins});}}
    if(kind==='backup'){try{const backup=JSON.parse(item.raw);if(backup.type!=='ior-visual-prototype'||!Array.isArray(backup.state?.servers)||!backup.state.settings||Array.isArray(backup.state.settings))throw Error();const restored={...structuredClone(clean),...structuredClone(backup.state)};for(const key of ['profiles','routes','subscriptions','services']){restored[key] ||= [];if(!Array.isArray(restored[key])||!restored[key].every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'))throw Error();}if(!restored.servers.every(s=>s&&typeof s.id==='string'&&typeof s.name==='string'&&typeof s.protocol==='string'&&typeof s.value==='string'))throw Error();for(const s of restored.servers){s.source ||= 'personal';s.params ||= decodeConfig(s.value,s.protocol);}restored.routes=restored.routes.map(r=>({...routeDefaults(),...r}));for(const r of restored.routes){for(const field of ['routeOrder','proxySites','directSites','blockSites','proxyIp','directIp','blockIp','proxyDomains','directDomains','blockDomains','proxyKeywords','directKeywords','blockKeywords'])if(!Array.isArray(r[field])||!r[field].every(v=>typeof v==='string'))throw Error();}for(const p of restored.profiles){p.configIds ||= [];if(!Array.isArray(p.configIds)||!p.configIds.every(v=>typeof v==='string'))throw Error();}restored.settings={...structuredClone(clean.settings),...restored.settings};for(const fields of Object.values(extraSettings))for(const [key,,value]of fields)restored.settings[key]??=value;if(!confirm('Заменить локальные данные прототипа резервной копией?'))return true;state=restored;connection='off';connectionError='';}catch{dialog.error='Некорректная резервная копия прототипа. Текущие данные сохранены.';render();return true;}}
    if(kind==='routeImport'){try{let imported;if(item.format==='ior'){const raw=JSON.parse(item.raw);if(!raw.name||!['ior','happ','clash'].includes(raw.source))throw Error();imported={...routeDefaults(),...raw};for(const key of ['routeOrder','proxySites','directSites','blockSites','proxyIp','directIp','blockIp'])if(!Array.isArray(imported[key]))throw Error();}else{if(!item.raw?.trim())throw Error();imported={...routeDefaults(),name:item.name||'Импортированный маршрут',source:item.format,raw:item.raw};}imported.id='route-'+Date.now();state.routes.push(imported);}catch{dialog.error='Проверьте формат и содержимое маршрута.';render();return true;}}
    persist();featureDirty=false;closeDialog();showToast('Сохранено только в прототипе.');return true;
  }
  return false;
}
function updateFeatureValue(el){if(dialog?.kind!=='feature')return;const key=el.dataset.feature;if(key){const arrays=['proxySites','directSites','blockSites','proxyIp','directIp','blockIp','proxyDomains','directDomains','blockDomains','proxyKeywords','directKeywords','blockKeywords','hwidApprovedOrigins'];dialog.item[key]=arrays.includes(key)?el.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean):el.value;featureDirty=true;dialog.error='';}if(el.dataset.featureConfig){const ids=new Set(dialog.item.configIds||[]);el.checked?ids.add(el.dataset.featureConfig):ids.delete(el.dataset.featureConfig);dialog.item.configIds=[...ids];featureDirty=true;}}
root.addEventListener('input',e=>updateFeatureValue(e.target));root.addEventListener('change',e=>{updateFeatureValue(e.target);if(e.target.dataset.feature==='source')render();if(e.target.dataset.serviceToggle){const item=state.services.find(s=>s.id===e.target.dataset.serviceToggle);item.visible=e.target.checked;persist();}});
root.addEventListener('contextmenu',e=>{const row=e.target.closest('[data-context]');if(!row)return;e.preventDefault();const anchor=row.querySelector('[data-action="server-menu"],[data-action="feature-object-menu"],[data-action="subscription-info"]')||row;openObjectMenu(row.dataset.context,row.dataset.objectId,anchor,{left:e.clientX,top:e.clientY,bottom:e.clientY});});
document.addEventListener('keydown',e=>{if(e.key!=='ContextMenu'&&!(e.shiftKey&&e.key==='F10'))return;const row=e.target.closest('[data-context]');if(!row)return;e.preventDefault();const anchor=row.querySelector('[data-action="server-menu"],[data-action="feature-object-menu"],[data-action="subscription-info"]')||row;openObjectMenu(row.dataset.context,row.dataset.objectId,anchor);});
root.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!['table-select','mode-tun','mode-proxy'].includes(action)||state.settings.reduced||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;root.querySelector('.soft-selected h1')?.animate?.([{opacity:.65},{opacity:1}],{duration:160,easing:'ease-out'});});

const originalInspector=inspector;inspector=function(){if(!editor)return '';const protocol=editor.protocol.toUpperCase();let fields=[];if(protocol==='HYSTERIA2')fields=[['obfsType','Obfs type'],['obfsPassword','Obfs password']];else if(protocol.includes('WIREGUARD')||protocol==='AMNEZIAWG')fields=[['preSharedKey','Pre-shared key'],['localAddress','Локальный адрес'],['allowedIps','Allowed IPs'],['persistentKeepalive','Keepalive']];else if(protocol==='SOCKS'||protocol==='HTTP')fields=[['username','Имя пользователя'],['password','Пароль'],['serverName','SNI']];else if(protocol==='VMESS')fields=[['userId','UUID'],['security','Security'],['alterId','Alter ID']];let extra=fields.map(([key,title])=>editorField(key,title,['persistentKeepalive','alterId'].includes(key)?'number':'text')).join('');if(['VLESS','VMESS','HYSTERIA2','TROJAN','SOCKS','HTTP'].includes(protocol))extra+='<label class="editor-check"><input type="checkbox" data-editor="allowInsecure" '+(editor.params.allowInsecure?'checked':'')+' '+(editor.source==='subscription'?'disabled':'')+'>Не проверять сертификат</label>';if(!['VLESS','HYSTERIA2','TROJAN'].includes(protocol))extra+='<p class="feature-note">Поля можно изучить в макете. Сериализация этого протокола требует существующего парсера приложения; исходный текст сохраняется.</p>';return originalInspector().replace('<details><summary>Ссылка и экспорт</summary>',(extra?'<details><summary>Дополнительные параметры протокола</summary>'+extra+'</details>':'')+'<details><summary>Ссылка и экспорт</summary>');};

function settingsChoiceRow(name,title,items,description){return `<div class="setting-row"><div><strong>${title}</strong><p>${description}</p></div><select data-setting="${name}" data-focus="setting-${name}" aria-label="${title}">${items.map(([id,label])=>`<option value="${id}" ${state.settings[name]===id?'selected':''}>${label}</option>`).join('')}</select></div>`;}
const normalizedCores={IorCore:'IorCore',SingBox:'IorCore',XrayCore:'XrayCore','ior-core':'IorCore','sing-box':'IorCore','xray-core':'XrayCore'};state.settings.selectedCore=normalizedCores[state.settings.selectedCore]||'IorCore';state.settings.language=({Russian:'ru',English:'en',ru:'ru',en:'en'}[state.settings.language]||'ru');persist();

  render();
})();
