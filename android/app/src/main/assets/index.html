.native-options h3{margin:0;font-size:17px}
.native-field{display:flex;flex-direction:column;gap:10px;font-size:15px}
.native-field>span{display:flex;justify-content:space-between;gap:12px}
.native-field select,.native-field input[type=url]{width:100%;box-sizing:border-box;min-height:48px;background:var(--field);color:inherit;border:1px solid var(--border);border-radius:12px;padding:12px;font:inherit}
.native-field input[type=range]{width:100%;height:32px;accent-color:var(--text,#aeb9d6);touch-action:pan-x}

.native-mode.selected{background:var(--hover);box-shadow:inset 0 0 0 1px var(--border)}
.native-warning{font-size:14px;line-height:1.5;margin:0;color:var(--text)}
.native-options input[type=checkbox][role=switch]{appearance:none;-webkit-appearance:none;position:relative;flex:0 0 48px;width:48px;height:28px;padding:0;border:1px solid var(--border);border-radius:999px;background:var(--field);transition:background-color 160ms;cursor:pointer}
.native-options input[type=checkbox][role=switch]::after{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform 160ms,background-color 160ms}
.native-options input[type=checkbox][role=switch]:checked{background:var(--accent)}
.native-options input[type=checkbox][role=switch]:checked::after{transform:translateX(20px);background:var(--on-accent)}
.native-options input[type=checkbox][role=switch]:disabled{opacity:.45;cursor:not-allowed}
.native-options input[type=checkbox][role=switch]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.reduced .native-options input[type=checkbox][role=switch],.reduced .native-options input[type=checkbox][role=switch]::after{transition:none}
@media(prefers-reduced-motion:reduce){.native-options input[type=checkbox][role=switch],.native-options input[type=checkbox][role=switch]::after{transition:none}}

// Android import sheet: one compositor animation owns transform at a time.

let androidSheetDrag=null,androidSheetMotion=null,androidSheetFrame=0,androidSheetRenderPending=false;
const androidSheetFrameRequest=callback=>window.requestAnimationFrame?window.requestAnimationFrame(callback):setTimeout(callback,16);
const androidSheetFrameCancel=id=>window.cancelAnimationFrame?window.cancelAnimationFrame(id):clearTimeout(id);
const androidSheetTranslate=y=>'translate3d(0,'+y+'px,0)';

}

}
function androidSheetCancelMotion(){

}
function androidSheetRenderDeferred(){

}

 const animation=panel.animate([{transform:from},{transform:to}],{duration,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});

 if(closing||opening){const overlay=root.querySelector('.overlay');if(overlay?.animate)current.scrimAnimation=overlay.animate([{opacity:closing?1:0},{opacity:closing?0:1}],{duration,easing:'linear',fill:'both'});}

  if(androidSheetMotion!==current)return;

const androidSheetOriginalAnimate=animateOnce;
animateOnce=function(key,el,frames,options){

const androidSheetOriginalBack=back;
back=function(fromHistory=false){
