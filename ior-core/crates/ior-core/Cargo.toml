[package]
name = "ior-core"
version = "0.1.0"
edition = "2021"
description = "ior network core foundation"

[dependencies]
tokio = { version = "1.53", features = ["io-util", "io-std", "net", "rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
getrandom = "=0.2.17"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"
rsteria2 = { version = "=0.1.1", path = "../../vendor-hysteria" }
log = "=0.4.34"
futures = "=0.3.34"
h2 = "=0.4.12"
http = "1"
bytes = "1"
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
netstack-smoltcp = "=0.2.4"
socket2 = { version = "=0.6.4", features = ["all"] }
regex = "=1.11.2"
sha2 = "=0.10.9"
shadowsocks = { version = "=1.25.0", default-features = false, features = ["aead-cipher", "aead-cipher-2022"] }
boringtun = { version = "=0.7.1", default-features = false }
ior-awg-noise = { path = "../../vendor-awg", default-features = false }
chacha20 = "=0.9.1"
base64 = "=0.22.1"
smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-tcp-cubic"] }
ior-vmess-codec = { path = "../../vendor-vmess" }
reality-rustls = { package = "rustls", path = "../../vendor-reality/rustls" }
reality-provider = { package = "rustls-aws-lc-rs", path = "../../vendor-reality/rustls-aws-lc-rs" }
reality-util = { package = "rustls-util", path = "../../vendor-reality/rustls-util" }

[target.'cfg(windows)'.dependencies]
tun-rs = { version = "=2.8.11", features = ["async_tokio"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
aws-lc-rs = "=1.18.1"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
smoltcp = { version = "=0.12.0", default-features = false, features = ["assembler-max-segment-count-32"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[lib]
name = "ior_core"
path = "src/lib.rs"

[[bin]]
name = "ior-core"
path = "src/main.rs"

