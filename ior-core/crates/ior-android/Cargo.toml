[package]
name = "ior-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "ior_android"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
ior-core = { path = "../ior-core" }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "sync"] }
jni = "=0.21.1"
libc = "0.2"
serde_json = "1"
rsteria2 = { path = "../../vendor-hysteria" }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"
http = "1"

