[package]
name = "ior-vmess-codec"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "VMess codec from shoes 0.2.2, embedded by ior-core"

[dependencies]
aes = "=0.8.4"
async-trait = "=0.1.89"
aws-lc-rs = { version = "=1.18.1", default-features = false }
bytes = "=1.11.0"
digest = "=0.10.7"
futures = "0.3"
log = "0.4"
rand = "=0.9.2"
serde = { version = "1", features = ["derive"] }
sha3 = "=0.10.8"
tokio = { version = "1", features = ["io-util", "net"] }
md-5 = "=0.10.6"
memchr = "=2.7.6"
rustc-hash = "=2.1.1"

[lib]
path = "src/lib.rs"
